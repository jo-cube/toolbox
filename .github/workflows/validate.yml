name: Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install RocksDB headers and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librocksdb-dev rocksdb-tools

      - name: Check formatting and shell syntax
        run: |
          files="$(gofmt -l .)"
          test -z "$files" || { printf 'Run gofmt on:\n%s\n' "$files"; exit 1; }
          for script in scripts/*.sh scripts/release-test/*.sh scripts/release-test/*/*.sh; do
            sh -n "$script"
          done

      - name: Test
        run: make test

      - name: Build
        run: make build VERSION=${GITHUB_SHA}

      - name: Smoke test local binaries
        run: TOOLBOX_BIN="$PWD/bin" sh scripts/smoke-local.sh
